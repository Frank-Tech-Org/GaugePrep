name: main-alarm

# Free plan has no branch protection, so detect a change to main that did not come from a release or hotfix PR.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for the PR behind this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.ref // ""')
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Open an issue if it was not a release or hotfix
        if: ${{ !startsWith(steps.pr.outputs.head, 'release/') && !startsWith(steps.pr.outputs.head, 'hotfix/') && !startsWith(steps.pr.outputs.head, 'develop') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "main changed outside a release: $SHA" \
            --body "Commit $SHA reached main by $ACTOR without a release or hotfix PR. Check it, and revert if it was not intended."
