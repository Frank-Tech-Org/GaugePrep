name: deploy-backend

# Builds, scans and pushes the backend image, then deploys it to one environment with Kamal.
# SECURITY: the caller passes only its own environment's Doppler token, so a job sees one prefix.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or staging
        required: true
        type: string
    secrets:
      DOPPLER_TOKEN:
        required: true

# WHY: every job states its own permissions below.
permissions: {}

env:
  IMAGE: ghcr.io/frank-tech-org/gaugeprep-backend
  KAMAL_VERSION: 2.12.0
  DOPPLER_VERSION: 3.77.1
  DOPPLER_SHA256: a7f4be5b30295921dfe1cdc34f905cd017210ec3264a47d46e315ab09cb03e1c
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f

jobs:
  deploy:
    # WHY: public repositories get arm64 hosted runners free; the image builds natively, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Check the environment
        run: |
          case "$ENVIRONMENT" in
            dev|staging) ;;
            *) echo "::error title=Environment::environment must be dev or staging, got '$ENVIRONMENT'"; exit 1 ;;
          esac
          echo "HOST=${ENVIRONMENT}.gaugeprep.com" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WHY: the Doppler binary is what Kamal's secrets adapter calls; hash pinned.
      - name: Install Doppler and Trivy
        run: |
          mkdir "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/doppler.tgz" "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/doppler_${DOPPLER_VERSION}_linux_arm64.tar.gz"
          echo "${DOPPLER_SHA256}  $RUNNER_TEMP/doppler.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/doppler.tgz" -C "$RUNNER_TEMP/bin" doppler
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install Kamal
        run: sudo gem install kamal -v "$KAMAL_VERSION" --no-document
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # WHY: loaded into the local daemon, not pushed, so the scan below runs before any push.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          target: production
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            service=gaugeprep-backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # SECURITY: run outside the checkout so no ignore file or config from the repo is read.
      - name: Scan the image
        run: |
          cd "$RUNNER_TEMP"
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE:$GITHUB_SHA"
      - name: Push the image
        run: docker push "$IMAGE:$GITHUB_SHA"
      # SECURITY: the key and the pinned host key come from this environment's Doppler config only.
      - name: Load the server key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-agent -a "$RUNNER_TEMP/agent.sock" > /dev/null
          echo "SSH_AUTH_SOCK=$RUNNER_TEMP/agent.sock" >> "$GITHUB_ENV"
          doppler secrets get SSH_PRIVATE_KEY --plain | SSH_AUTH_SOCK="$RUNNER_TEMP/agent.sock" ssh-add -
          printf '%s %s\n' "$(doppler secrets get SERVER_HOST --plain)" "$(doppler secrets get SERVER_HOST_KEY --plain)" > ~/.ssh/known_hosts
      # WHY: the image is already built and pushed, so Kamal only rolls it out.
      - name: Deploy with Kamal
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: kamal deploy -c infra/kamal/deploy.yml -d "$ENVIRONMENT" --skip-push --version "$GITHUB_SHA"
      - name: Check the health endpoint
        run: |
          body=$(curl -sS --fail --retry 10 --retry-delay 3 --retry-all-errors "https://$HOST/api/v1/health")
          echo "$body"
          echo "$body" | jq -e '.database == "ok"' > /dev/null
