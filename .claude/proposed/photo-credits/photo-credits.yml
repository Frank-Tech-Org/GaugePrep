name: photo-credits

# Fails a pull request when a photo has no complete credits row or is over the size limit.
# SECURITY: the check script is read from the base branch, so a PR cannot weaken its own check.
on:
  pull_request:
    branches: [develop, stage, main]

permissions:
  contents: read

concurrency:
  group: photo-credits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every photo has a credits row
        run: |
          if ! git cat-file -e "$BASE:.github/scripts/check-photo-credits.sh" 2>/dev/null; then
            echo "The base branch has no photo check yet; skipping."
            exit 0
          fi
          git show "$BASE:.github/scripts/check-photo-credits.sh" > "$RUNNER_TEMP/check-photo-credits.sh"
          bash "$RUNNER_TEMP/check-photo-credits.sh" apps/web/public/photos
