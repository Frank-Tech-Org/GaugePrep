<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreGauge</title></head>
<body>
<div id="root" class="gp-row" style="align-items:flex-start"></div>
<script>
  var G = window.GaugePrep, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(G.ScoreGauge, { levels: ['4','5','6','7','8','9','10','11'], reading: 3, value: 'NCLC 7', caption: 'Range NCLC 6 to 7 · based on 3 simulations' }),
    h(G.ScoreGauge, { reading: 3, value: 'B2', label: 'Niveau estimé', caption: 'Fourchette B1 à B2 · fiabilité élevée' })));
</script>
</body></html>
