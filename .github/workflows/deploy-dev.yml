name: deploy-dev

# Deploys the backend to dev on every push to develop, after the pull request checks pass.
# SECURITY: the dev environment holds the token and limits which branches may deploy.
on:
  push:
    branches: [develop]

# WHY: every job states its own permissions below.
permissions: {}

# WHY: a newer push waits for the running deploy and replaces any older waiting one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-backend.yml
    # WHY: the environment's token reaches the called workflow only when the caller inherits.
    secrets: inherit
    with:
      environment: dev
