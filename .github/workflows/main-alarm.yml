name: main-alarm

# Free plan has no branch protection, so flag a change to main or stage not from an allowed PR.
on:
  push:
    branches: [main, stage]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for the PR behind this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.ref // ""')
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # WHY: main takes stage or hotfix/*; stage takes develop or main (hotfix back-merge).
      - name: Open an issue if it was not an allowed PR
        if: >-
          ${{ (github.ref_name == 'main' && steps.pr.outputs.head != 'stage' && !startsWith(steps.pr.outputs.head, 'hotfix/'))
          || (github.ref_name == 'stage' && steps.pr.outputs.head != 'develop' && steps.pr.outputs.head != 'main') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "$BRANCH changed outside a release: $SHA" \
            --body "Commit $SHA reached $BRANCH by $ACTOR without an allowed PR. Check it, and revert if it was not intended."
