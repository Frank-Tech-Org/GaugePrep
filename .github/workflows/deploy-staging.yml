name: deploy-staging

# Deploys staging on a push to stage, or by hand from stage or a hotfix branch.
# SECURITY: the staging environment holds the token and limits which branches may deploy.
on:
  push:
    branches: [stage]
  workflow_dispatch:

# WHY: every job states its own permissions below.
permissions: {}

# WHY: a newer push waits for the running deploy and replaces any older waiting one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # WHY: a promotion merge adds nothing to a develop commit whose checks passed, so skip them.
  # SECURITY: any doubt (no second parent, tree differs, no proof) leaves reuse unset: full checks.
  verify:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Promotion already tested
        id: proof
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$GITHUB_SHA^2^{tree}")" ]
          # SECURITY: the proof script is the one on the first parent, not on the pushed commit.
          git show "$GITHUB_SHA^1:.github/scripts/tree-proof.sh" > "$RUNNER_TEMP/tree-proof.sh"
          proof=$(bash "$RUNNER_TEMP/tree-proof.sh" develop "$(git rev-parse "$GITHUB_SHA^{tree}")" jobs)
          if [ -n "$proof" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Checks reused::this tree is develop commit ${proof:0:7}, whose checks passed"
          fi

  checks:
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.reuse != 'true' && (github.ref == 'refs/heads/stage' || startsWith(github.ref, 'refs/heads/hotfix/')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [verify, checks]
    if: ${{ !cancelled() && (needs.verify.outputs.reuse == 'true' || needs.checks.result == 'success') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-backend.yml
    # WHY: the environment's token reaches the called workflow only when the caller inherits.
    secrets: inherit
    with:
      environment: staging

  pages:
    needs: [verify, checks]
    if: ${{ !cancelled() && github.ref == 'refs/heads/stage' && (needs.verify.outputs.reuse == 'true' || needs.checks.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      environment: staging
