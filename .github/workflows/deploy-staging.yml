name: deploy-staging

# Deploys the backend to staging on a push to stage, or by hand from stage or a hotfix branch.
# SECURITY: the staging environment holds the token and limits which branches may deploy.
on:
  push:
    branches: [stage]
  workflow_dispatch:

# WHY: every job states its own permissions below.
permissions: {}

# WHY: a newer push waits for the running deploy and replaces any older waiting one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/stage' || startsWith(github.ref, 'refs/heads/hotfix/')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-backend.yml
    # WHY: the environment's token reaches the called workflow only when the caller inherits.
    secrets: inherit
    with:
      environment: staging
