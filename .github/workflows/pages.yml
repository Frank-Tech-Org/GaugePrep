name: pages

# Publishes the web placeholder to Cloudflare Pages by direct upload, after the PR checks pass.
# SECURITY: each job reads only its own prefix's secrets; the checks never see the Pages tokens.
on:
  push:
    branches: [develop, stage]
  workflow_dispatch:

# WHY: every job states its own permissions below.
permissions: {}

env:
  WRANGLER_VERSION: 4.153.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/stage'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  dev:
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: pages-dev
      cancel-in-progress: false
    steps:
      # WHY: if a newer commit landed since this run started, its run publishes and this one stops.
      - name: Check this is still the branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::develop has moved on to ${current:0:7}; the run for that commit publishes."
          fi
      - if: steps.head.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WHY: the pnpm version comes from the packageManager field in package.json.
      - if: steps.head.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.head.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the placeholder
        if: steps.head.outputs.publish == 'true'
        run: node apps/web/scripts/build-placeholder.mjs dev "$GITHUB_SHA"
      # WHY: the Pages production branch is main on both projects; --branch main goes live.
      - name: Publish to gaugeprep-dev
        if: steps.head.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEV_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy apps/web/dist --project-name gaugeprep-dev --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

  staging:
    needs: checks
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: pages-staging
      cancel-in-progress: false
    steps:
      - name: Check this is still the branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/stage" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::stage has moved on to ${current:0:7}; the run for that commit publishes."
          fi
      - if: steps.head.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WHY: the pnpm version comes from the packageManager field in package.json.
      - if: steps.head.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.head.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the placeholder
        if: steps.head.outputs.publish == 'true'
        run: node apps/web/scripts/build-placeholder.mjs staging "$GITHUB_SHA"
      - name: Publish to gaugeprep-staging
        if: steps.head.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy apps/web/dist --project-name gaugeprep-staging --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
