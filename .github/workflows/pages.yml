name: pages

# Publishes the web placeholder to Cloudflare Pages by direct upload. Each job reads only its own prefix's secrets.
# Run it by hand from develop or stage to republish the current head.
on:
  push:
    branches: [develop, stage]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.153.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pages-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the placeholder
        run: node apps/web/scripts/build-placeholder.mjs dev "$GITHUB_SHA"
      # Pages production branch is main on both projects; --branch main makes this the live deployment.
      - name: Publish to gaugeprep-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEV_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy apps/web/dist --project-name gaugeprep-dev --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

  staging:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pages-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the placeholder
        run: node apps/web/scripts/build-placeholder.mjs staging "$GITHUB_SHA"
      - name: Publish to gaugeprep-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy apps/web/dist --project-name gaugeprep-staging --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
