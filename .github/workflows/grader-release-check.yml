name: grader release check

# Runs the anchor set through the grader and fails if any release threshold is missed.
# The grader is a stub for now: no model call, no secrets.
on:
  pull_request:
    branches: [develop, stage, main]
    paths:
      - "backend/modules/assessment/grader/**"
      - "tools/grader_check/**"
      - ".github/workflows/grader-release-check.yml"
  # A manual run can pick the deliberately failing placeholder set to show the check goes red.
  workflow_dispatch:
    inputs:
      anchor_set:
        description: Anchor set to run
        type: choice
        options: [placeholder, placeholder-failing]
        default: placeholder

permissions:
  contents: read

concurrency:
  group: grader-release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: grader release check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The tool is stdlib only, so it runs without syncing the workspace.
      - name: Run the release check
        env:
          ANCHOR_SET: ${{ inputs.anchor_set || 'placeholder' }}
          PYTHONPATH: tools
        run: |
          uv run --no-project --python 3.14 python -m grader_check \
            --anchors "tools/grader_check/anchors/$ANCHOR_SET" \
            --report "$RUNNER_TEMP/grader-check-report.json"
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grader-check-report
          path: ${{ runner.temp }}/grader-check-report.json
          if-no-files-found: error
