name: Feature
description: New behaviour for learners, admins or operators
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and who it is for.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will be built.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements, one checkbox each.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or decisions this depends on, or "none".
    validations:
      required: true
