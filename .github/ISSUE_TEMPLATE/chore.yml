name: Chore
description: Setup, infrastructure, CI, tooling or documentation with no user-visible change
title: "chore: "
type: Chore
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this is needed."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "What will be done."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Testable statements, one checkbox each."
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Issues this depends on, or \"none\"."
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: "Delete the items that do not apply to this ticket. Review and QA check the rest."
      value: |
        - [ ] Every acceptance criterion verified, with the command output in the PR
        - [ ] No secrets in the repository; new settings documented in `.env.example`
        - [ ] Security review with no CRITICAL or HIGH if infrastructure exposure, secrets or CI permissions changed
        - [ ] Docs, runbook or README updated, or not needed
    validations:
      required: true
