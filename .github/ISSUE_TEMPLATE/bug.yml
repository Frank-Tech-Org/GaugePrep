name: Bug
description: Something that used to work or was specified does not work
title: "fix: "
type: Bug
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Staging, Production]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Logs, screenshots, request IDs, Sentry link."
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "How we know it is fixed. Includes a regression test."
      value: "- [ ] A test reproduces the bug and now passes
- [ ] "
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: "Delete the items that do not apply to this ticket. Review and QA check the rest."
      value: |
        - [ ] Fix verified in the environment where the bug was found
        - [ ] Other places that use the same code checked for the same bug
        - [ ] Each changed endpoint keeps its success, not-found and other-learner tests
        - [ ] Security review with no CRITICAL or HIGH if authentication, payments, personal data, migrations, append-only data or AI prompts changed
        - [ ] Claims register updated if what a learner can do changed
    validations:
      required: true
