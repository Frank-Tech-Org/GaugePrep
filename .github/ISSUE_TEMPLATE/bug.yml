name: Bug
description: Something that used to work or was specified does not work
title: "fix: "
type: Bug
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Staging, Production]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Logs, screenshots, request IDs, Sentry link."
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "How we know it is fixed. Includes a regression test."
      value: "- [ ] A test reproduces the bug and now passes
- [ ] "
    validations:
      required: true
