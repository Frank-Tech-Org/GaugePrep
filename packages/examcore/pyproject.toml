[project]
name = "examcore"
version = "0.0.0"
description = "Exam rules, rule checks and scoring maths. Must not depend on Django."
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examcore"]

[tool.coverage.report]
include = ["*/packages/examcore/*"]
fail_under = 95
show_missing = true
