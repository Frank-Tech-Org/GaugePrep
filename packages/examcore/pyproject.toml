[project]
name = "examcore"
version = "0.0.0"
description = "Exam rules, rule checks and scoring maths. Must not depend on Django."
requires-python = ">=3.14,<3.15"
dependencies = ["urllib3==1.26.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examcore"]
