[project]
name = "linguamentor"
version = "0.0.0"
description = "LinguaMentor workspace root"
requires-python = ">=3.14,<3.15"
dependencies = ["examcore", "linguamentor-backend", "linguamentor-voice"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "packages/examcore", "voice"]

[tool.uv.sources]
examcore = { workspace = true }
linguamentor-backend = { workspace = true }
linguamentor-voice = { workspace = true }
