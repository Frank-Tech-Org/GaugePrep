[project]
name = "linguamentor"
version = "0.0.0"
description = "LinguaMentor workspace root"
requires-python = ">=3.14,<3.15"
dependencies = ["examcore", "linguamentor-backend", "linguamentor-voice"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "packages/examcore", "voice"]

[tool.uv.sources]
examcore = { workspace = true }
linguamentor-backend = { workspace = true }
linguamentor-voice = { workspace = true }

[dependency-groups]
dev = [
    "django-stubs>=5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["packages/examcore/src", "backend", "voice"]
explicit_package_bases = true
mypy_path = ["packages/examcore/src", "backend"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
testpaths = ["backend", "packages", "voice"]
pythonpath = ["backend"]
# --ds beats a DJANGO_SETTINGS_MODULE left in the shell, so tests always use the test settings.
addopts = "--ds=config.settings.test -p conftest --strict-markers -rsx --cov --cov-branch --cov-report="
timeout = 30

[tool.coverage.run]
source = ["packages/examcore/src/examcore", "backend"]
patch = ["subprocess"]
omit = ["*/backend/tests/*", "*/conftest.py", "*/manage.py", "*/migrations/*"]

[tool.importlinter]
root_packages = ["examcore", "modules"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules import only each other's public"
type = "independence"
modules = [
    "modules.identity",
    "modules.learner",
    "modules.curriculum",
    "modules.content",
    "modules.exammodels",
    "modules.practice",
    "modules.simulation",
    "modules.assessment",
    "modules.prediction",
    "modules.calibration",
    "modules.billing",
    "modules.engagement",
    "modules.reporting",
    "modules.admin",
]
ignore_imports = ["modules.** -> modules.*.public"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "examcore never imports Django"
type = "forbidden"
source_modules = ["examcore"]
forbidden_modules = ["django"]

[[tool.importlinter.contracts]]
name = "No import cycles between modules"
type = "acyclic_siblings"
ancestors = ["modules"]
