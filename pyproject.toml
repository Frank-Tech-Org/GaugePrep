[project]
name = "gaugeprep"
version = "0.0.0"
description = "GaugePrep workspace root"
requires-python = ">=3.14,<3.15"
dependencies = ["examcore", "gaugeprep-backend", "gaugeprep-voice"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "packages/examcore", "apps/voice"]

[tool.uv.sources]
examcore = { workspace = true }
gaugeprep-backend = { workspace = true }
gaugeprep-voice = { workspace = true }

[dependency-groups]
asr-benchmark = [
    "av>=14.0",
    "faster-whisper>=1.1",
    "pyarrow>=14.0.1",
    "websockets>=14.0",
]
dev = [
    "django-stubs>=5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "schemathesis==4.33.0",
]

[tool.ruff]
extend = "tooling/python/ruff.toml"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["packages/examcore/src", "apps/backend", "apps/voice", "tooling/ci", "tooling/asr_benchmark"]
explicit_package_bases = true
mypy_path = ["packages/examcore/src", "apps/backend", "tooling/ci/changed_lines_coverage", "tooling/ci", "tooling"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
testpaths = ["apps/backend", "packages", "apps/voice"]
pythonpath = ["apps/backend", "tooling/ci", "tooling"]
# --ds beats a DJANGO_SETTINGS_MODULE left in the shell, so tests always use the test settings.
addopts = "--ds=config.settings.test -p conftest -p no_skip_under_ci.plugin --strict-markers -rsx --cov --cov-branch --cov-report="
timeout = 30

[tool.coverage.run]
source = ["packages/examcore/src/examcore", "apps/backend"]
patch = ["subprocess"]
omit = ["*/apps/backend/tests/*", "*/conftest.py", "*/manage.py", "*/migrations/*"]
