[project]
name = "linguamentor"
version = "0.0.0"
description = "LinguaMentor workspace root"
requires-python = ">=3.14,<3.15"
dependencies = ["examcore", "linguamentor-backend", "linguamentor-voice"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "packages/examcore", "voice"]

[tool.uv.sources]
examcore = { workspace = true }
linguamentor-backend = { workspace = true }
linguamentor-voice = { workspace = true }

[dependency-groups]
dev = [
    "django-stubs>=5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.11",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["packages/examcore/src", "backend", "voice"]
explicit_package_bases = true
mypy_path = ["packages/examcore/src", "backend"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
testpaths = ["backend", "packages", "voice"]
pythonpath = ["backend"]
# --ds beats a DJANGO_SETTINGS_MODULE left in the shell, so tests always use the test settings.
addopts = "--ds=config.settings.test"

[tool.importlinter]
root_packages = ["examcore"]
include_external_packages = false
