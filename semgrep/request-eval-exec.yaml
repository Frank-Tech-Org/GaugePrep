# Own rules (not from semgrep-rules). The CI check loads this file from the base commit.
rules:
  - id: lm-django-request-eval
    mode: taint
    languages: [python]
    severity: ERROR
    message: Request data reaches eval(). Parse the input (int, json.loads, ast.literal_eval) instead of running it as Python.
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(GET|POST|body|data|query_params|COOKIES|META|headers|FILES)$
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|self\.request)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: ast.literal_eval(...)
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: builtins.eval(...)

  - id: lm-django-request-exec
    mode: taint
    languages: [python]
    severity: ERROR
    message: Request data reaches exec(). Parse the input instead of running it as Python.
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(GET|POST|body|data|query_params|COOKIES|META|headers|FILES)$
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|self\.request)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: ast.literal_eval(...)
    pattern-sinks:
      - pattern-either:
          - pattern: exec(...)
          - pattern: builtins.exec(...)

  - id: lm-ninja-param-eval
    mode: taint
    languages: [python]
    severity: ERROR
    message: A Django Ninja endpoint parameter reaches eval(). Parse the input instead of running it as Python.
    pattern-sources:
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-inside: |
              @$R.$METHOD(...)
              def $F($REQ, ..., $P: $T, ...):
                  ...
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: ast.literal_eval(...)
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: builtins.eval(...)

  - id: lm-ninja-param-exec
    mode: taint
    languages: [python]
    severity: ERROR
    message: A Django Ninja endpoint parameter reaches exec(). Parse the input instead of running it as Python.
    pattern-sources:
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-inside: |
              @$R.$METHOD(...)
              def $F($REQ, ..., $P: $T, ...):
                  ...
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: ast.literal_eval(...)
    pattern-sinks:
      - pattern-either:
          - pattern: exec(...)
          - pattern: builtins.exec(...)
